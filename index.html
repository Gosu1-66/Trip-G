<!doctype html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TripG</title>
<style>
/* 旅遊手帳：深色／淺色兩種模式，強調色可選白、藍、金 */
:root{
  --r:18px;
  --font: -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono: ui-monospace,"SF Mono",Menlo,monospace;
}
/* 深色（預設） */
:root,:root[data-theme=dark]{
  color-scheme: dark;
  --bg:#0f0e0d; --bg2:#151413; --card:#1a1816; --card2:#211f1c; --line:#2d2a26; --line2:#3a3632;
  --ink:#f4f0ea; --ink2:#d9d3ca; --muted:#9b938a; --faint:#645d56;
  --sheet:#171513; --note:#1c1a17; --chip:#2b2824; --navbg:rgba(15,14,13,.94);
  --red:#e0675f; --red-ink:#f19a93; --amber:#d9a35b; --amber-ink:#e9bd85;
  --spot:#86b89c; --food:#ff6b6b; --shop:#cf86a3; --transport:#86a6d6; --hotel:#ab92d6; --flight:#6fbcc0;
  --shadow:0 4px 18px rgba(0,0,0,.45);
  --gold:#4c8dff; --gold-2:#4c8dff; --gold-hi:#7aaaff; --on-gold:#fff; --gold-grad:linear-gradient(#4c8dff,#4c8dff);
}
:root[data-theme=dark][data-accent=red]{ --gold:#ff4b3e; --gold-2:#ff4b3e; --gold-hi:#ff7a70; --on-gold:#1a0503; --gold-grad:linear-gradient(#ff4b3e,#ff4b3e); }
:root[data-theme=dark][data-accent=taxi]{ --gold:#ffc400; --gold-2:#ffc400; --gold-hi:#ffd54a; --on-gold:#1a1400; --gold-grad:linear-gradient(#ffc400,#ffc400); }
:root[data-theme=dark][data-accent=gold]{ --gold-2:#cdb07a; --gold:#cdb07a; --gold-hi:#dcc597; --on-gold:#15110a; --gold-grad:linear-gradient(#cdb07a,#cdb07a); }
/* 淺色 */
:root[data-theme=light]{
  color-scheme: light;
  --bg:#f5f1e9; --bg2:#fffdf9; --card:#fffdf9; --card2:#f1ece3; --line:#e4ddd1; --line2:#d4cbbd;
  --ink:#1e1a16; --ink2:#3d3731; --muted:#73695f; --faint:#a89e92;
  --sheet:#fffdf9; --note:#f6f1e8; --chip:#ebe4d8; --navbg:rgba(250,247,241,.94);
  --red:#d0453d; --red-ink:#c2413a; --amber:#c27f1f; --amber-ink:#94570f;
  --spot:#3f8f63; --food:#d64545; --shop:#b0507a; --transport:#3f6fb8; --hotel:#7556b8; --flight:#2b8f95;
  --shadow:0 4px 16px rgba(0,0,0,.08);
  --gold:#2a6fe0; --gold-2:#2a6fe0; --gold-hi:#1f5bc4; --on-gold:#fff; --gold-grad:linear-gradient(#2a6fe0,#2a6fe0);
}
:root[data-theme=light][data-accent=red]{ --gold:#d9302a; --gold-2:#d9302a; --gold-hi:#b8221d; --on-gold:#fff; --gold-grad:linear-gradient(#d9302a,#d9302a); }
:root[data-theme=light][data-accent=taxi]{ --gold:#f5b800; --gold-2:#f5b800; --gold-hi:#8a6500; --on-gold:#1a1400; --gold-grad:linear-gradient(#f5b800,#f5b800); }
:root[data-theme=light][data-accent=gold]{ --gold-2:#8a703c; --gold:#a3864a; --gold-hi:#7d6431; --on-gold:#fff; --gold-grad:linear-gradient(#a3864a,#a3864a); }
:root{ --gold-l:color-mix(in srgb,var(--gold) 12%,transparent); --red-l:color-mix(in srgb,var(--red) 12%,transparent); --amber-l:color-mix(in srgb,var(--amber) 14%,transparent);
  --hero-bg:radial-gradient(120% 120% at 50% 0%,color-mix(in srgb,var(--gold) 12%,var(--card)) 0%,var(--card) 70%); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.home{padding-bottom:30px}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--gold-hi)}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* 頂部 */
.top{padding:calc(12px + env(safe-area-inset-top)) 0 4px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);text-decoration:none}
.pill.gold{border-color:color-mix(in srgb,var(--gold) 50%,transparent);color:var(--gold-hi)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn svg{width:18px;height:18px}
h1{font-size:22px;margin:12px 0 8px;font-weight:800;letter-spacing:.5px;color:var(--gold-hi);text-wrap:balance}
.sub{color:var(--muted);font-size:12px}
.sec-title{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;margin:16px 0 8px}
.sec-title svg{width:16px;height:16px;color:var(--gold)}

/* 通用元件 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0;position:relative}
.btn{border:1px solid var(--line2);border-radius:14px;padding:11px 16px;font-weight:600;background:var(--card2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:transparent;color:var(--gold-hi);border-color:var(--gold)}
.btn.solid{background:var(--gold-grad);color:var(--on-gold);border-color:transparent;font-weight:800}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red-ink);border-color:color-mix(in srgb,var(--red) 35%,transparent);background:var(--red-l)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.row.wrapf{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.i{width:100%;border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:10px 12px;outline:none;min-width:0}
.i::placeholder{color:var(--faint)}
.i:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 12%,transparent)}
.i.filled{border-color:var(--gold)}
textarea.i{min-height:80px;resize:vertical;line-height:1.5}
select.i{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.on{color:var(--gold-hi);border-color:var(--gold);background:var(--gold-l);font-weight:700}
.chip .n{background:var(--chip);color:var(--ink);border-radius:999px;padding:0 6px;font-size:10px;font-weight:700}
.chip.on .n{background:var(--gold);color:var(--on-gold)}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin:10px 0}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 6px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:var(--card2);color:var(--gold-hi);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);font-weight:600;white-space:nowrap}
.tag.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.tag.red{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.empty{color:var(--muted);text-align:center;padding:34px 12px;font-style:italic;line-height:1.7}
.warn{background:var(--amber-l);color:var(--amber-ink);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);border-radius:12px;padding:8px 10px;font-size:12px;margin-top:8px}
.err{background:var(--red-l);color:var(--red-ink);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);border-radius:12px;padding:10px;font-size:13px;margin:10px 0}
.ok{background:var(--card);color:var(--ink);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:12px;padding:10px;font-size:13px;margin:10px 0}
.meta{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.55}
.meta b{color:var(--ink)}
.stars{color:var(--gold-hi);letter-spacing:1px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--gold);border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.av{width:26px;height:26px;border-radius:50%;background:var(--chip);display:inline-grid;place-items:center;font-size:14px;flex:none;border:1px solid var(--line2)}
.mchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:12px;cursor:pointer;background:var(--card);color:var(--muted)}
.mchip.on{border-color:var(--gold);color:var(--gold-hi);background:var(--gold-l)}
.mchip .av{width:22px;height:22px;font-size:12px}
.progress{height:6px;background:var(--chip);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold-grad);border-radius:999px}
.ring{width:44px;height:44px;flex:none}
.note{background:var(--note);border-left:2px solid var(--gold);border-radius:0 10px 10px 0;padding:8px 10px;font-size:13px;line-height:1.6;white-space:pre-wrap;margin-top:10px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:10px 0 0;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;word-break:break-word}
.money{font-family:var(--mono);font-weight:700;color:var(--gold-hi)}

/* 首頁 */
.home-hero{padding:calc(28px + env(safe-area-inset-top)) 0 10px}
.home-hero h1{font-size:28px;margin:0}
.tripcard{display:flex;align-items:center;gap:12px;cursor:pointer}
.tripicon{width:44px;height:44px;border-radius:14px;background:var(--gold-l);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);display:grid;place-items:center;color:var(--gold);flex:none}
.tripicon svg{width:22px;height:22px}
.code{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}

/* 日期列 */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.theme{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:5px 11px;font-size:12px;background:var(--card);cursor:pointer;max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.days{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none;user-select:none;-webkit-user-select:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:60px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 0 7px;text-align:center;cursor:pointer;-webkit-touch-callout:none}
.day small{display:block;font-size:9px;color:var(--muted);letter-spacing:.5px}
.day b{display:block;font-size:15px;font-family:var(--mono);margin:1px 0}
.day.on{border-color:var(--gold);background:var(--gold-l);color:var(--gold-hi)}
.day.on small{color:var(--gold)}
.day.swap{border-style:dashed;border-color:var(--amber);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.day.add{display:grid;place-items:center;color:var(--muted);font-size:22px;border-style:dashed}
.hint{font-size:11px;color:var(--faint);margin:2px 0 8px}

/* 時間軸與卡片 */
.timeline{position:relative;padding-left:16px}
.timeline::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;border-left:1px dashed var(--line2)}
.tl-item{position:relative}
.tl-item::before{content:"";position:absolute;left:-15px;top:26px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.it{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:12px 0;overflow:hidden;cursor:pointer}
.it.flash{box-shadow:0 0 0 2px var(--gold)}
.it-head{display:flex;gap:10px;padding:12px 12px 0;align-items:flex-start}
.kicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--kc);background:color-mix(in srgb,var(--kc) 14%,transparent);border:1px solid color-mix(in srgb,var(--kc) 30%,transparent)}
.kicon svg{width:19px;height:19px}
.k-spot{--kc:var(--spot)} .k-food{--kc:var(--food)} .k-shop{--kc:var(--shop)} .k-transport{--kc:var(--transport)} .k-hotel{--kc:var(--hotel)} .k-flight{--kc:var(--flight)}
.kline{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);letter-spacing:.8px}
.tbadge{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--on-gold);background:var(--gold);border-radius:6px;padding:1px 6px;letter-spacing:0}
.it-title{font-weight:800;font-size:16px;margin-top:3px;line-height:1.35}
.it-tools{display:flex;gap:2px;flex:none}
.it-tools button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.it-tools svg{width:13px;height:13px}
.loc{display:flex;align-items:center;gap:8px;margin:10px 12px 0;border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--muted)}
.loc span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc a{color:var(--gold);display:grid;place-items:center}
.loc svg{width:15px;height:15px;flex:none}
.it-body{padding:0 12px 12px}
.cover{position:relative;margin:10px 12px 0;border-radius:14px;overflow:hidden;aspect-ratio:16/10;background:var(--sheet)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .cnt{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;border-radius:999px;padding:2px 8px}
.cover .zoom{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:999px;padding:2px 8px}
.costrow{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:10px;font-size:13px}
.costrow .money{font-size:13px}
.members{font-size:11px;color:var(--muted);margin-top:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stay{border:1px dashed var(--line2);border-radius:14px;padding:10px 12px;margin:12px 0;font-size:13px;cursor:pointer;color:var(--muted)}
.stay b{color:var(--ink)}

/* 航班 */
.fl-top{display:flex;align-items:center;gap:10px;margin-top:10px}
.fl-logo{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--flight) 16%,transparent);color:var(--flight);display:grid;place-items:center;flex:none}
.fl-logo svg{width:20px;height:20px}
.dur{margin-left:auto;font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:3px 9px;color:var(--ink);font-family:var(--mono)}
.fl3{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:end;margin-top:12px}
.fl3 .lbl{font-size:10px;color:var(--muted);margin-bottom:3px}
.fl3 .city{font-weight:800;font-size:15px}
.fl3 .city .mono{font-size:12px;color:var(--muted);margin-left:3px}
.fl3 .ap{font-size:10px;color:var(--muted);line-height:1.3}
.fl3 .tm{font-family:var(--mono);font-size:20px;font-weight:700;margin-top:4px}
.fl3 .r{text-align:right}
.fl3 .mid{text-align:center;font-size:11px;color:var(--muted);padding-bottom:4px}
.fl3 .mid b{display:block;color:var(--ink);font-size:13px}
.lay{display:inline-block;background:var(--amber-l);color:var(--amber-ink);border-radius:6px;padding:1px 6px;font-size:10px;margin-top:3px}
.fl-info{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;font-size:11px;color:var(--muted)}
.fl-info b{display:block;color:var(--ink);font-size:12px;margin-top:2px}
.bags{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px}

/* 交通 */
.modes{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:6px}
.modes .m{font-size:10px;border:1px solid var(--line2);border-radius:6px;padding:1px 6px;color:var(--muted)}
.modes .arr{font-size:10px;color:var(--faint)}
.tr3{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-top:12px}
.tr3 .lbl{font-size:10px;color:var(--muted)}
.tr3 .tm{font-family:var(--mono);font-size:22px;font-weight:700}
.tr3 .pl{font-size:11px;line-height:1.35}
.tr3 .r{text-align:right}
.tr3 .mid{text-align:center;font-size:10px;color:var(--muted)}
.tr3 .via{display:inline-block;margin-top:3px;background:var(--amber-l);color:var(--amber-ink);border-radius:6px;padding:1px 6px}
.seglist{margin-top:10px;border-top:1px dashed var(--line2);padding-top:8px}
.segi{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:6px 0;font-size:12px}
.segi .no{width:20px;height:20px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:10px;color:var(--gold)}
.segi .xfer{grid-column:2;background:var(--amber-l);color:var(--amber-ink);border-radius:8px;padding:3px 8px;font-size:11px;margin-top:4px}
.more{display:block;width:100%;text-align:center;font-size:12px;color:var(--muted);background:none;border:0;padding:8px 0 0;cursor:pointer}

/* 浮動按鈕與底部分頁 */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(90px + env(safe-area-inset-bottom));background:var(--card);color:var(--gold-hi);border:1px solid var(--gold);border-radius:999px;padding:12px 18px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.7);z-index:15;cursor:pointer;display:flex;align-items:center;gap:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(4px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-right));z-index:20}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);padding:5px 4px;border-radius:12px;cursor:pointer;flex:1;min-width:0}
nav.tabs svg{width:21px;height:21px}
nav.tabs button.on{color:var(--gold-hi)}
nav.tabs button.on svg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--gold) 40%,transparent))}

/* 彈出視窗 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);border-top:1px solid var(--line2);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:0 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;position:relative}
.sheet-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;background:var(--sheet);margin:0 -16px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head h3{margin:0;font-size:17px;flex:1;min-width:0;color:var(--ink)}
.sheet-x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--card2);color:var(--ink);font-size:15px;cursor:pointer;flex:none}
.sheet-foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--sheet);margin:14px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:18px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.modal-msg{margin:0 0 16px;line-height:1.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--card2);color:var(--ink);border:1px solid var(--line2);padding:10px 16px;border-radius:999px;font-size:13px;z-index:95;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.chooser{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;cursor:pointer;color:var(--ink)}
.chooser .kicon{width:46px;height:46px}
.chooser small{font-weight:400;color:var(--muted);font-size:11px;text-align:center}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--sheet)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.75);color:#fff;font-size:11px;cursor:pointer}
.ph .star{position:absolute;left:4px;top:4px;font-size:10px;background:rgba(0,0,0,.7);color:var(--gold-hi);border-radius:999px;padding:1px 6px;border:0;cursor:pointer}
.ph .mv{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:linear-gradient(transparent,rgba(0,0,0,.75));padding:10px 4px 3px}
.ph .mv button{border:0;background:none;color:#fff;font-size:11px;cursor:pointer;padding:2px 4px}
.ph.add{display:grid;place-items:center;border-style:dashed;color:var(--muted);font-size:12px;cursor:pointer;text-align:center}
.viewer{position:fixed;inset:0;background:#000;z-index:96;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;user-select:none}
.viewer .vtop{position:fixed;top:calc(12px + env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:12px}
.viewer .vhint{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#888;font-size:11px}
.legbox,.segbox{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px;background:var(--bg2)}
.legbox .lh,.segbox .lh{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--gold)}
.aibox{border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:14px;padding:12px;margin:12px 0 4px;background:var(--gold-l)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;cursor:pointer}
.sw{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--faint);transition:.2s}
.toggle.on .sw{background:var(--gold)}
.toggle.on .sw::after{left:21px;background:var(--on-gold)}
.posopt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.posopt button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;font-size:11px;color:var(--muted);cursor:pointer}
.posopt button.on{border-color:var(--gold);color:var(--gold-hi)}
input[type=range]{width:100%;accent-color:var(--gold)}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.catgrid button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 4px;font-size:12px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.catgrid button.on{border-color:var(--gold);color:var(--gold-hi);background:var(--gold-l)}
.catgrid svg{width:18px;height:18px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:800;color:var(--gold-hi);margin-top:2px}
.bigmoney{border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:20px;padding:18px;text-align:center;background:var(--hero-bg)}
.bigmoney .v{font-family:var(--mono);font-size:34px;font-weight:800;color:var(--gold-hi);margin-top:6px}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;cursor:pointer;background:transparent;color:var(--on-gold);font-size:13px;font-weight:900;padding:0}
.check.on{background:var(--gold);border-color:var(--gold)}
.done-text{text-decoration:line-through;color:var(--faint)}
.mrow{display:flex;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mprice{color:var(--gold-hi);font-weight:700;margin-left:4px}
.steps{padding-left:20px;line-height:1.75;font-size:13px}
.steps li{margin-bottom:6px}
.steps code{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:12px;color:var(--gold-hi)}
.preview{white-space:pre-wrap;font-family:var(--mono);font-size:12px;line-height:1.6;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:40vh;overflow:auto}
.handbook{position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#1a1a1a}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* 對齊與防止左右滑動 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:hidden;max-width:100%}
@supports (overflow:clip){html,body{overflow-x:clip}}
.i,input,textarea,select{font-size:16px}
input[type=date],input[type=time],input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;min-width:0;width:100%;min-height:44px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
.col2>*,.row>*{min-width:0}
.row>.iconbtn,.row>.btn.sm,.row>.chip,.row>.pill{flex:none}
.toprow>.row{flex:none}
.pill,.chip,.tag,.theme{white-space:nowrap}
.dayhead .sec-title{flex:none}
.dayhead>.row{flex:1;justify-content:flex-end;min-width:0}
.theme{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.row>.hint{flex:1}
.it,.card{max-width:100%}
.it-title,.fl3 .city,.tr3 .pl{overflow-wrap:anywhere}
nav.tabs button{overflow:hidden}
.seg{min-width:0}
.seg button{min-width:0;white-space:nowrap}
.theme-opt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.theme-opt button{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:12px 6px;font-size:13px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.theme-opt button.on{border-color:var(--gold);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold)}
.theme-opt .sw2{width:28px;height:28px;border-radius:50%;border:1px solid var(--line2)}

/* ================= 登機證風格：實心強調色、不發光 ================= */
:root{ --glow:none; --grad-border:none; }
.aurora{display:none}
.card,.it{background:var(--card)}
:root[data-theme=light] .card,:root[data-theme=light] .it{box-shadow:0 1px 0 var(--line)}
h1{color:var(--ink);letter-spacing:.3px}
h1::after{content:"";display:block;width:34px;height:4px;background:var(--gold);margin-top:8px}
.home-hero h1::after{width:44px}
.day.on,.chip.on,.seg button.on,.theme-opt button.on,.mchip.on,.catgrid button.on,.posopt button.on{background:var(--gold);border-color:var(--gold);color:var(--on-gold);box-shadow:none}
.day.on small,.day.on b{color:var(--on-gold)}
.chip.on .n{background:var(--on-gold);color:var(--gold)}
.seg button.on svg,.catgrid button.on svg{color:var(--on-gold)}
.btn.primary{background:transparent;border-color:var(--gold);color:var(--gold-hi)}
.pill.gold{border-color:var(--gold);color:var(--gold-hi)}
.btn.solid{background:var(--gold);color:var(--on-gold);box-shadow:none}
.tbadge{background:var(--gold);color:var(--on-gold)}
.fab{background:var(--gold);color:var(--on-gold);border:0;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.tl-item::before{border-color:var(--gold);background:var(--bg)}
.timeline::before{border-left:1px dashed var(--line2)}
nav.tabs{border-top:1px solid var(--line)}
nav.tabs button{position:relative}
nav.tabs button.on{color:var(--gold-hi)}
nav.tabs button.on::after{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;background:var(--gold)}
nav.tabs button.on svg{filter:none}
.bigmoney{border:1px solid var(--line2);background:var(--card);position:relative;overflow:hidden}
.bigmoney::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gold)}
.bigmoney .v{color:var(--ink)}
.money{color:var(--gold-hi)}
.tripicon{background:var(--gold);color:var(--on-gold);border:0}
.progress i{background:var(--gold)}
/* 機場看板感：英文小標用等寬字 */
.kline,.day small,.fl3 .lbl,.tr3 .lbl{font-family:var(--mono);letter-spacing:1px;text-transform:uppercase}
.it{border-left:4px solid var(--kc,var(--line))}
.it-head .kicon{border-radius:10px}
.it,.card,.btn,.chip,.day{transition:transform .12s ease}
.it:active,.tripcard:active,.btn:active,.chip:active,.day:active{transform:scale(.985)}
.theme-opt .sw2{box-shadow:none}
.days,.chips{padding:6px 2px 8px;margin:0 -2px}
.seg{overflow:visible}

/* ================= 繽紛：每個分頁、每種類型各有顏色 ================= */
:root,:root[data-theme=dark]{ --c-teal:#22c3b8; --c-blue:#4c8dff; --c-green:#2fc47a; --c-pink:#ff5c8a; --c-yellow:#ffc233; --c-purple:#a07cff; --c-red:#ff4b3e; --on-kind:#111; --on-yellow:#1a1400; --yellow-ink:#ffc233; }
:root[data-theme=light]{ --c-teal:#0f9e94; --c-blue:#2a6fe0; --c-green:#16995a; --c-pink:#e2457a; --c-yellow:#f0ad00; --c-purple:#7656e8; --c-red:#d9302a; --on-kind:#fff; --on-yellow:#1a1400; --yellow-ink:#9a6c00; }
:root[data-accent=multi]{ --gold:var(--c-blue); --gold-hi:var(--c-blue); --on-gold:#fff; --gold-grad:linear-gradient(var(--c-blue),var(--c-blue)); }
:root[data-accent=multi][data-tab=book]{ --gold:var(--c-purple); --gold-hi:var(--c-purple); }
:root[data-accent=multi][data-tab=money]{ --gold:var(--c-green); --gold-hi:var(--c-green); }
:root[data-accent=multi][data-tab=journal]{ --gold:var(--c-pink); --gold-hi:var(--c-pink); }
:root[data-accent=multi][data-tab=lists]{ --gold:var(--c-yellow); --gold-hi:var(--yellow-ink); --on-gold:var(--on-yellow); }
:root[data-accent=multi][data-tab=members]{ --gold:var(--c-teal); --gold-hi:var(--c-teal); }
/* 底部分頁：每顆有自己的顏色 */
:root[data-accent=multi] nav.tabs button[data-tab=plan]{--tc:var(--c-blue)}
:root[data-accent=multi] nav.tabs button[data-tab=book]{--tc:var(--c-purple)}
:root[data-accent=multi] nav.tabs button[data-tab=money]{--tc:var(--c-green)}
:root[data-accent=multi] nav.tabs button[data-tab=journal]{--tc:var(--c-pink)}
:root[data-accent=multi] nav.tabs button[data-tab=lists]{--tc:var(--c-yellow)}
:root[data-accent=multi] nav.tabs button[data-tab=members]{--tc:var(--c-teal)}
:root[data-accent=multi] nav.tabs button svg{color:var(--muted)}
:root[data-accent=multi] nav.tabs button.on{color:var(--ink)}
:root[data-accent=multi] nav.tabs button.on svg{color:var(--tc)}
:root[data-accent=multi] nav.tabs button.on::after{background:var(--tc)}
/* 日期：只有選中的那天上色 */
/* 分類篩選：用各類型的顏色 */
:root[data-accent=multi] .chip[data-f=food]{--fc:var(--food)}
:root[data-accent=multi] .chip[data-f=spot]{--fc:var(--spot)}
:root[data-accent=multi] .chip[data-f=shop]{--fc:var(--shop)}
:root[data-accent=multi] .chip[data-f=move]{--fc:var(--transport)}
:root[data-accent=multi] .chip[data-f=hotel]{--fc:var(--hotel)}
:root[data-accent=multi] .chip[data-f] svg{color:var(--fc,var(--gold))}
:root[data-accent=multi] .chip[data-f].on{background:var(--fc,var(--gold));border-color:var(--fc,var(--gold));color:var(--on-kind)}
:root[data-accent=multi] .chip[data-f=all].on{color:#fff}
:root[data-accent=multi] .chip[data-f].on svg{color:inherit}
:root[data-accent=multi] .chip[data-f].on .n{background:rgba(0,0,0,.22);color:inherit}
/* 卡片時間標籤跟著類型顏色 */
:root[data-accent=multi] .it .tbadge{background:var(--kc);color:var(--on-kind)}
/* 上方按鈕：只有 IG 匯入有顏色，其他維持灰階 */
:root[data-accent=multi] #t_ig{border-color:var(--c-pink);color:var(--c-pink)}
#t_share{border-color:var(--line2);color:var(--ink)}
h1::after{width:34px;background:var(--gold)}

/* ================= 候選配色 ================= */
:root[data-accent=morandi]{ --gold:#8fa9c9; --gold-hi:#a9c0dc; --on-gold:#10131a; --gold-grad:linear-gradient(#8fa9c9,#8fa9c9);
  --food:#d39b9b; --spot:#9dbf9f; --shop:#c9a3c4; --transport:#8fa9c9; --hotel:#b3a6d4; --flight:#8fc2bd; }
:root[data-accent=morandi][data-tab=book]{ --gold:#b3a6d4; --gold-hi:#c7bce3; }
:root[data-accent=morandi][data-tab=money]{ --gold:#9dbf9f; --gold-hi:#b4d2b6; }
:root[data-accent=morandi][data-tab=journal]{ --gold:#d39b9b; --gold-hi:#e2b2b2; }
:root[data-accent=morandi][data-tab=lists]{ --gold:#d8c08f; --gold-hi:#e4cfa6; }
:root[data-accent=morandi][data-tab=members]{ --gold:#8fc2bd; --gold-hi:#a8d3cf; }
:root[data-accent=teal]{ --gold:#2dd4bf; --gold-hi:#5eead4; --on-gold:#04201c; --gold-grad:linear-gradient(#2dd4bf,#2dd4bf); }
:root[data-accent=wine]{ --gold:#d0506e; --gold-hi:#e37791; --on-gold:#fff; --gold-grad:linear-gradient(#d0506e,#d0506e); }
:root[data-accent=mint]{ --gold:#a7e3c4; --gold-hi:#c3f0d8; --on-gold:#0d2018; --gold-grad:linear-gradient(#a7e3c4,#a7e3c4); }
:root[data-accent=morandi] .it .tbadge,:root[data-accent=teal] .it .tbadge,:root[data-accent=wine] .it .tbadge,:root[data-accent=mint] .it .tbadge{background:var(--kc);color:#111}

/* ================= 灰底 ================= */
:root[data-theme=grey]{
  color-scheme: dark;
  --bg:#2a2b2f; --bg2:#303136; --card:#35363c; --card2:#3d3e45; --line:#46474f; --line2:#53545d;
  --ink:#f2f2f4; --ink2:#dcdce0; --muted:#a8a9b1; --faint:#7a7b84;
  --sheet:#303136; --note:#33343a; --chip:#4a4b53; --navbg:rgba(42,43,47,.95);
  --red:#ef6f66; --red-ink:#ff9a92; --amber:#e0aa62; --amber-ink:#f0c68e;
  --spot:#8fc4a5; --food:#f08585; --shop:#d892b0; --transport:#8fb0e0; --hotel:#b39ce0; --flight:#7cc8cb;
  --shadow:0 4px 16px rgba(0,0,0,.3); --on-kind:#111;
  --c-teal:#2fcfc3; --c-blue:#5d9bff; --c-green:#3fd08a; --c-pink:#ff6f98; --c-yellow:#ffc94a; --c-purple:#ae8cff; --c-red:#ff5b4f; --on-yellow:#1a1400; --yellow-ink:#ffc94a;
}
/* 白底：比較乾淨的白 */
:root[data-theme=light]{ --bg:#f4f5f7; --bg2:#ffffff; --card:#ffffff; --card2:#f1f2f5; --line:#e3e5ea; --line2:#d3d6dd; --ink:#17181c; --ink2:#3a3c42; --muted:#6b6e76; --faint:#a3a6ae; --sheet:#ffffff; --note:#f5f6f8; --chip:#eceef2; --navbg:rgba(255,255,255,.95); }
:root[data-theme=light][data-accent=morandi]{ --gold:#5f7fa6; --gold-hi:#4c6b91; --on-gold:#fff; --food:#b86b6b; --spot:#5f8f66; --shop:#9a6a94; --transport:#5f7fa6; --hotel:#7b6aa8; --flight:#4f8f89; }
:root[data-theme=light][data-accent=morandi][data-tab=book]{ --gold:#7b6aa8; --gold-hi:#6a5a95; }
:root[data-theme=light][data-accent=morandi][data-tab=money]{ --gold:#5f8f66; --gold-hi:#4d7a54; }
:root[data-theme=light][data-accent=morandi][data-tab=journal]{ --gold:#b86b6b; --gold-hi:#a05858; }
:root[data-theme=light][data-accent=morandi][data-tab=lists]{ --gold:#b0945a; --gold-hi:#8f7642; }
:root[data-theme=light][data-accent=morandi][data-tab=members]{ --gold:#4f8f89; --gold-hi:#3f7a74; }
:root[data-theme=light][data-accent=teal]{ --gold:#0f9e8e; --gold-hi:#0b8072; --on-gold:#fff; }
:root[data-theme=light][data-accent=wine]{ --gold:#b3364f; --gold-hi:#962a41; --on-gold:#fff; }
:root[data-theme=light][data-accent=mint]{ --gold:#3aa57a; --gold-hi:#2c8762; --on-gold:#fff; }
:root[data-theme=light] .it .tbadge{color:#fff}
/* 灰底也套用候選配色 */
:root[data-theme=grey][data-accent=morandi]{ --gold:#8fa9c9; --gold-hi:#a9c0dc; --on-gold:#10131a; --gold-grad:linear-gradient(#8fa9c9,#8fa9c9);
  --food:#d39b9b; --spot:#9dbf9f; --shop:#c9a3c4; --transport:#8fa9c9; --hotel:#b3a6d4; --flight:#8fc2bd; }
:root[data-theme=grey][data-accent=morandi][data-tab=book]{ --gold:#b3a6d4; --gold-hi:#c7bce3; }
:root[data-theme=grey][data-accent=morandi][data-tab=money]{ --gold:#9dbf9f; --gold-hi:#b4d2b6; }
:root[data-theme=grey][data-accent=morandi][data-tab=journal]{ --gold:#d39b9b; --gold-hi:#e2b2b2; }
:root[data-theme=grey][data-accent=morandi][data-tab=lists]{ --gold:#d8c08f; --gold-hi:#e4cfa6; }
:root[data-theme=grey][data-accent=morandi][data-tab=members]{ --gold:#8fc2bd; --gold-hi:#a8d3cf; }
:root[data-theme=grey][data-accent=teal]{ --gold:#2dd4bf; --gold-hi:#5eead4; --on-gold:#04201c; --gold-grad:linear-gradient(#2dd4bf,#2dd4bf); }
:root[data-theme=grey][data-accent=wine]{ --gold:#d0506e; --gold-hi:#e37791; --on-gold:#fff; --gold-grad:linear-gradient(#d0506e,#d0506e); }
:root[data-theme=grey][data-accent=mint]{ --gold:#a7e3c4; --gold-hi:#c3f0d8; --on-gold:#0d2018; --gold-grad:linear-gradient(#a7e3c4,#a7e3c4); }

/* 灰底的香檳金 */
:root[data-theme=grey][data-accent=gold]{ --gold:#cdb07a; --gold-hi:#dcc597; --on-gold:#1a1408; --gold-grad:linear-gradient(#cdb07a,#cdb07a); }
/* 自訂主色：顏色由 JS 寫在 --cu、--cu-on */
:root[data-accent=custom],:root[data-theme=light][data-accent=custom],:root[data-theme=grey][data-accent=custom]{ --gold:var(--cu); --gold-hi:color-mix(in srgb,var(--cu) 78%,var(--ink)); --on-gold:var(--cu-on); --gold-grad:linear-gradient(var(--cu),var(--cu)); }
/* 自訂顏色挑選器 */
.pick-prev{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:14px}
.pp-day{display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:5px 10px;font-size:12px}
.pp-day small{font-family:var(--mono);font-size:9px;letter-spacing:1px;opacity:.8}
.pp-fab{border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px}
.pp-chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;background:var(--card);color:var(--muted)}
.pp-tab{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;font-size:11px}
.pp-tab span{width:28px;height:3px;border-radius:3px}
.pick-sw{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.pick-sw button{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.pick-sw button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.pick-sl{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.pick-sl input[type=range]{-webkit-appearance:none;appearance:none;height:10px;border-radius:999px;background:var(--chip);outline:none}
.pick-sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #555;box-shadow:0 1px 4px rgba(0,0,0,.4)}

/* ================= 背景：點陣、航線、等高線（很淡） ================= */

const PH = (() => {
  let dbp;
  const open = () => dbp ||= new Promise((res, rej) => { const r = indexedDB.open('tripapp-photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => res(r.result); r.onerror = () => { dbp = null; rej(r.error); }; });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('p', mode); const r = fn(t.objectStore('p')); t.oncomplete = () => res(r?.result); t.onerror = () => rej(t.error); }); };
  const cache = new Map();
  return {
    put: (id, b) => { cache.delete(id); return tx('readwrite', st => st.put(b, id)); },
    get: id => tx('readonly', st => st.get(id)).catch(() => null),
    del: id => { cache.delete(id); return tx('readwrite', st => st.delete(id)).catch(() => {}); },
    async url(id){ if (cache.has(id)) return cache.get(id); const b = await this.get(id); const u = b ? URL.createObjectURL(b) : ''; cache.set(id, u); return u; }
  };
})();
const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
function compressImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = async () => {
      URL.revokeObjectURL(url);
      let max = 1600, q = .8, blob;
      for (let i = 0; i < 4; i++) {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
        if (blob && blob.size <= 1024 * 1024) break;
        max = Math.round(max * .8); q -= .1;
      }
      blob ? res(blob) : rej(new Error('壓縮失敗'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('無法讀取這張圖片')); };
    img.src = url;
  });
}
async function addPhotos(files){
  const ids = [];
  for (const f of files) { try { const b = await compressImage(f); const id = 'ph_' + uid() + uid(); await PH.put(id, b); ids.push(id); } catch (e) { toast(e.message); } }

}

function viewPhotos(ids, start = 0){

    bg.querySelector('.sheet-x').onclick = e => { e.stopPropagation(); bg.remove(); };
  };
  let sx = null;
  bg.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  bg.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50 && ids.length > 1) { i = (i + (dx < 0 ? 1 : -1) + ids.length) % ids.length; show(); bg.dataset.swiped = '1'; } });
  bg.addEventListener('click', e => { if (bg.dataset.swiped) { delete bg.dataset.swiped; return; } if (ids.length > 1 && e.target.tagName === 'IMG') { const r = e.target.getBoundingClientRect(); i = (i + (e.clientX > r.left + r.width / 2 ? 1 : -1) + ids.length) % ids.length; show(); return; } bg.remove(); });
  show();
}

    items: [], members: [me], meId: me.id, expenses: [], fund: [], journal: [], todos: [], packing: {}, docs: [],
    rates: { ...DEFAULT_RATES }, currency: 'TWD', createdAt: Date.now() };
}

// 舊版資料轉成新版
function migrate(D = S, main = true){
  D.v ||= 1;
  D.pocket ||= []; D.menus ||= {}; D.trips ||= [];
  if (D.v < 2) {
    for (const t of D.trips) {
      if (typeof t.days === 'number') t.days = Array.from({ length: t.days }, (_, i) => ({ id: uid(), theme: '', emoji: '' }));
      t.code ||= Math.random().toString(36).slice(2, 8).toUpperCase();
      t.members ||= [{ id: uid(), name: '我', avatar: '🧑' }]; t.meId ||= t.members[0].id;
      t.expenses ||= []; t.fund ||= []; t.journal ||= []; t.todos ||= []; t.packing ||= {}; t.docs ||= []; t.rates ||= { ...DEFAULT_RATES }; t.currency ||= 'TWD';
      t.items = (t.items || []).map((it, n) => {
        const day = t.days[Math.min(it.day ?? 0, t.days.length - 1)];
        const food = /餐|食|咖啡|酒|bar|cafe|麵|飯|甜|冰|小吃|海鮮/i.test(it.type || '');
        return { ...it, dayId: it.dayId || day.id, kind: it.kind || (food ? 'food' : 'spot'), title: it.title || it.name || '未命名', location: it.location || it.address || '', order: n, photos: it.photos || [] };
      });
      for (const b of (t.bookings || [])) {
        const di = Math.max(0, Math.min(diffDays(t.start, b.date || t.start), t.days.length - 1));
        const base = { id: b.id || uid(), dayId: t.days[di].id, kind: b.kind, time: b.time || '', note: b.note || '', order: 999, photos: [], cost: b.price ? { label: '價格', text: b.price } : null };
        if (b.kind === 'flight') t.items.push({ ...base, title: [b.airline, b.flightNo].filter(Boolean).join(' ') || '航班', airline: b.airline, flightNo: b.flightNo, legs: [{ flightNo: b.flightNo, from: b.from, to: b.to, depDate: b.date, depTime: b.time, arrDate: b.arrDate || b.date, arrTime: b.arrTime }], bagChecked: b.bag, cabin: b.seat, ref: b.ref });
        else if (b.kind === 'hotel') t.items.push({ ...base, title: b.name || '住宿', location: b.address || '', nights: Math.max(1, diffDays(b.date, b.endDate || isoAdd(b.date, 1))), checkOut: b.endTime || '', room: b.room, ref: b.ref, platform: b.platform, phone: b.phone });
        else t.items.push({ ...base, title: [b.type, b.from && b.to ? `${b.from} → ${b.to}` : (b.from || b.to)].filter(Boolean).join('：') || '交通', mode: b.type || '包車', segments: [{ mode: b.type || '包車', from: b.from, to: b.to, dep: b.time, arr: b.endTime }], provider: b.provider, contact: b.contact, ref: b.ref });
      }
      delete t.bookings;
    }
    for (const p of D.pocket) { p.cat ||= /餐|食|咖啡|酒|bar|cafe|麵|飯|甜|冰|海鮮/i.test(p.type || '') ? 'food' : 'spot'; p.tags ||= []; p.photos ||= []; }
    D.v = 2;
  }
  if (main && !D.seededBkk) {
    const seed = SEED_BKK();
    for (const p of seed.pocket) if (!D.pocket.some(x => x.name === p.name)) D.pocket.push(p);
    for (const [k, m] of Object.entries(seed.menus)) if (!D.menus[k]) D.menus[k] = m;
    D.seededBkk = true;
  }
  if (main && !D.trips.length) { const t = newTrip('曼谷 5 天', isoAdd(localISO(new Date()), 30), 5); D.trips.push(t); }
  D.view ||= 'home'; D.tab ||= 'plan';
  if (!D.trips.some(t => t.id === D.tripId)) D.tripId = D.trips[0].id;
  if (main) save();
}
const trip = () => S.trips.find(t => t.id === S.tripId) || S.trips[0];

function toTWD(t, amount, cur){ return (Number(amount) || 0) * rate(t, cur); }
function fmtMoney(v, cur = 'TWD'){ const n = Math.round(Number(v) || 0); return (cur === 'TWD' ? 'NT$ ' : cur + ' ') + n.toLocaleString(); }
function fmtAmt(a, cur){ const n = Number(a) || 0; return `${cur || 'TWD'} ${n % 1 ? n.toFixed(2) : n.toLocaleString()}`; }
function dayItems(t, dayId){ return t.items.filter(i => i.dayId === dayId).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); }
function insertOrdered(t, item){
  const list = dayItems(t, item.dayId);
  let pos = list.length;
  if (item.time) { const k = list.findIndex(x => x.time && x.time > item.time); if (k >= 0) pos = k; }
  list.splice(pos, 0, item); list.forEach((x, n) => x.order = n);
  if (!t.items.includes(item)) t.items.push(item);
}
function itemCostTWD(t, it){
  const c = it.cost; if (!c || !(Number(c.amount) > 0)) return 0;
  const n = c.perPerson ? Math.max(1, (it.members?.length || t.members.length)) : 1;
  return toTWD(t, c.amount, c.currency) * n;
}

function bindDays(t){

    const start = () => { long = false; timer = setTimeout(() => { long = true; swapFrom = b.dataset.day; if (navigator.vibrate) try { navigator.vibrate(20); } catch (e) {}
      $$('.day').forEach(x => x.classList.toggle('swap', x === b)); const h = $('.hint'); if (h) h.innerHTML = '<b style="color:var(--amber)">對調模式：點選要交換的日期（再點一次同一天取消）</b>'; toast('點選要對調的日期'); }, 550); };
    const cancel = () => { clearTimeout(timer); if (long) { window.__lpAt = Date.now(); window.__lpId = b.dataset.day; } };
    b.addEventListener('pointerdown', start); b.addEventListener('pointerup', cancel); b.addEventListener('pointerleave', cancel); b.addEventListener('pointercancel', cancel);

function stayBanners(t, di){
  const out = [];
  for (const h of t.items.filter(i => i.kind === 'hotel')) {
    const hi = dayIndex(t, h.dayId); if (hi < 0) continue;
    const n = Math.max(1, Number(h.nights) || 1);

  }
  return out;
}

function bookingPrompt(t, kind, text){
  const base = `從下面的${KIND[kind].label}訂位資料中取出資訊，只回傳一個 JSON 物件。找不到的欄位給空字串，不要猜。日期格式 YYYY-MM-DD，時間格式 HH:MM（24 小時制）。行程第一天是 ${t.start}，年份不明時以此推算。除了專有名詞，用繁體中文。\n`;
  const shape = {
    flight: '{"airline":"航空公司","cabin":"艙等或座位","bagChecked":"托運行李額度","bagCabin":"手提行李額度","ref":"訂位代號","price":數字或空字串,"currency":"三碼幣別","legs":[{"flightNo":"","from":"三碼代號 機場名，例如 TPE 桃園機場","to":"","depDate":"","depTime":"","arrDate":"","arrTime":"","terminal":"航廈或登機門"}]}（轉機時 legs 放多段）',
    transport: '{"title":"簡短標題，例如 蘇黎世機場 → Stein am Rhein","mode":"交通類型，例如 鐵路運輸、包車","date":"","time":"","provider":"業者","contact":"聯絡方式","ref":"訂單編號","price":數字或空字串,"currency":"","segments":[{"mode":"列車/高鐵/地鐵/巴士/纜車/船/包車/計程車/租車/步行/其他 其中一個","from":"","to":"","dep":"","arr":"","note":""}]}',
    hotel: '{"title":"飯店名稱","location":"地址","checkInDate":"","checkInTime":"","checkOutDate":"","checkOutTime":"","room":"房型","ref":"訂房代號","platform":"訂房平台","phone":"","price":數字或空字串,"currency":""}'
  }[kind];
  return base + '格式：' + shape + '\n\n=== 資料 ===\n' + (text || '（請看截圖）');
}
function applyBookingAI(t, kind, r, v, el){
  if (!r || typeof r !== 'object') return 0;
  let n = 0; const set = (id, val) => { const i = el.querySelector('#' + id); if (i && val != null && String(val).trim() !== '') { i.value = String(val).trim(); i.classList.add('filled'); n++; } };
  const okD = s => /^\d{4}-\d{2}-\d{2}$/.test(s || ''), okT = s => /^\d{2}:\d{2}$/.test(s || '');
  const setDay = iso => { if (!okD(iso)) return; const i = diffDays(t.start, iso); if (i >= 0 && i < t.days.length) { set('f_day', t.days[i].id); v.dayId = t.days[i].id; } };
  if (r.price) { set('c_amt', parseFloat(String(r.price).replace(/[^\d.]/g, ''))); if (CURS(t).includes(r.currency)) set('c_cur', r.currency); }
  if (kind === 'flight') {
    set('f_airline', r.airline); set('f_cabin', r.cabin); set('f_bagc', r.bagChecked); set('f_bagh', r.bagCabin); set('f_ref', r.ref);
    const legs = Array.isArray(r.legs) ? r.legs.filter(l => l && (l.from || l.to)) : [];
    if (legs.length) { v.legs = legs.map(l => ({ flightNo: l.flightNo || '', from: l.from || '', to: l.to || '', depDate: okD(l.depDate) ? l.depDate : '', depTime: okT(l.depTime) ? l.depTime : '', arrDate: okD(l.arrDate) ? l.arrDate : '', arrTime: okT(l.arrTime) ? l.arrTime : '', terminal: l.terminal || '' })); n += legs.length * 4; setDay(v.legs[0].depDate); if (okT(v.legs[0].depTime)) set('f_time', v.legs[0].depTime); }
  }
  if (kind === 'transport') {
    set('f_title', r.title); set('f_mode', r.mode); set('f_prov', r.provider); set('f_contact', r.contact); set('f_ref', r.ref); setDay(r.date); if (okT(r.time)) set('f_time', r.time);
    const segs = Array.isArray(r.segments) ? r.segments.filter(s => s && (s.from || s.to)) : [];
    if (segs.length) { v.segments = segs.map(s => ({ mode: T_MODES.includes(s.mode) ? s.mode : '其他', from: s.from || '', to: s.to || '', dep: okT(s.dep) ? s.dep : '', arr: okT(s.arr) ? s.arr : '', note: s.note || '' })); n += segs.length * 3; }
  }
  if (kind === 'hotel') {
    set('f_title', r.title); set('f_loc', r.location); set('f_room', r.room); set('f_ref', r.ref); set('f_plat', r.platform); set('f_phone', r.phone);
    setDay(r.checkInDate); if (okT(r.checkInTime)) set('f_time', r.checkInTime); if (okT(r.checkOutTime)) set('f_co', r.checkOutTime);
    if (okD(r.checkInDate) && okD(r.checkOutDate)) set('f_nights', Math.max(1, diffDays(r.checkInDate, r.checkOutDate)));
  }
  return n;
}

  const list = t.items.filter(i => i.potential && itemCostTWD(t, i) > 0);
  const total = list.reduce((s, i) => s + itemCostTWD(t, i), 0);
  const per = {}; t.members.forEach(m => per[m.id] = 0);
  for (const it of list) { const ids = it.members?.length ? it.members : t.members.map(m => m.id); const v = itemCostTWD(t, it) / ids.length; ids.forEach(id => { if (id in per) per[id] += v; }); }
  sheet('潛在花費清單', `
    <div class="bigmoney" style="margin-top:12px"><div class="sub">預估總額（約略 TWD）</div><div class="v">${fmtMoney(total)}</div></div>
    <div class="sub" style="margin:14px 0 6px">個人分攤預估</div>
    <div class="statgrid">${t.members.map(m => `<div class="stat"><div class="row" style="gap:6px"><span class="av">${esc(m.avatar)}</span><span class="grow">${esc(m.name)}</span></div><div class="v" style="font-size:16px">${fmtMoney(per[m.id])}</div></div>`).join('')}</div>
    <div class="sub" style="margin:14px 0 6px">項目明細（點一下跳到該行程）</div>
    ${list.length ? list.map(it => { const di = dayIndex(t, it.dayId); return `<div class="card" data-jump="${it.id}" style="cursor:pointer;margin:8px 0"><div class="row">${kicon(it.kind)}<div class="grow"><b>${esc(it.title)}</b><div class="sub">Day ${di + 1} · ${esc(it.cost.label || '費用')} ${fmtAmt(it.cost.amount, it.cost.currency)}${it.cost.perPerson ? ' × ' + (it.members?.length || t.members.length) + ' 人' : ''}</div></div><span class="money">≈ ${fmtMoney(itemCostTWD(t, it))}</span></div></div>`; }).join('')
      : '<div class="empty">還沒有潛在花費<br>在行程項目的「費用」打開「列入潛在花費」就會出現在這裡</div>'}
    <button class="btn ghost block" data-a="close" style="margin:14px 0 6px">關閉</button>`, (el, close) => {
    el.querySelector('[data-a=close]').onclick = close;
    $$('[data-jump]', el).forEach(c => c.onclick = () => { const it = t.items.find(x => x.id === c.dataset.jump); close(); S.tab = 'plan'; S.dayId = it.dayId; S.filter = 'all'; save(); render(); setTimeout(() => { const n = $('#it_' + it.id); if (n) { n.scrollIntoView({ block: 'center' }); n.classList.add('flash'); setTimeout(() => n.classList.remove('flash'), 1500); } }, 50); });
  });
}

/* ================= 記帳 ================= */
const EXP_CATS = [['transport','交通',I.transport],['hotel','住宿',I.hotel],['food','餐飲',I.food],['spot','景點',I.spot],['shop','購物',I.shop],['other','其他',ic('<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>')]];
function expTWD(t, e){ return toTWD(t, (Number(e.amount) || 0) * (1 + (e.feeOn ? (Number(e.feePct) || 0) / 100 : 0)), e.currency); }
function balances(t){
  const b = {}; t.members.forEach(m => b[m.id] = { paid: 0, owe: 0 });
  for (const e of t.expenses) { const v = expTWD(t, e); if (b[e.payer]) b[e.payer].paid += v; const ids = (e.split?.length ? e.split : t.members.map(m => m.id)).filter(id => b[id]); ids.forEach(id => b[id].owe += v / ids.length); }
  return b;
}
function settle(t){
  const b = balances(t); const cred = [], debt = [];
  for (const [id, x] of Object.entries(b)) { const d = Math.round(x.paid - x.owe); if (d > 0) cred.push([id, d]); else if (d < 0) debt.push([id, -d]); }
  const out = []; let i = 0, j = 0;
  while (i < debt.length && j < cred.length) { const v = Math.min(debt[i][1], cred[j][1]); if (v > 0) out.push([debt[i][0], cred[j][0], v]); debt[i][1] -= v; cred[j][1] -= v; if (!debt[i][1]) i++; if (!cred[j][1]) j++; }
  return out;
}
function renderMoney(){

  } else body = fundHTML(t);
  $('#root').innerHTML = `<div class="wrap">${tripTop(t)}
    <div class="seg">${[['split','分帳記帳',I.money],['fund','公費管理',I.coins]].map(([k, l, icn]) => `<button data-mt="${k}" class="${mode === k ? 'on' : ''}">${icn.replace('<svg','<svg width="15" height="15"')}${l}</button>`).join('')}</div>${body}</div>`;
  bindTop();
  $$('[data-mt]').forEach(b => b.onclick = () => { S.moneyTab = b.dataset.mt; save(); render(); });
  $$('[data-ms]').forEach(b => b.onclick = () => { S.moneySub = b.dataset.ms; save(); render(); });
  if (mode === 'split' && sub === 'add') bindExpenseForm(t, $('#root'), null);
  if (mode === 'split' && sub === 'list') {
    $$('[data-exp]').forEach(c => c.onclick = () => { const e = t.expenses.find(x => x.id === c.dataset.exp); sheet('編輯支出', expenseFormHTML(t, e), (el, close) => bindExpenseForm(t, el, e, close)); });
  }
  if (mode === 'fund') bindFund(t);
  fab(null);
}

function bindExpenseForm(t, el, e, close){
  bindPicker(el);
  const g = id => el.querySelector('#' + id);
  let pay = e?.pay || 'cash', cat = e?.cat || 'food';
  $$('[data-pay]', el).forEach(b => b.onclick = () => { pay = b.dataset.pay; $$('[data-pay]', el).forEach(x => x.classList.toggle('on', x === b)); });
  $$('[data-cat]', el).forEach(b => b.onclick = () => { cat = b.dataset.cat; $$('[data-cat]', el).forEach(x => x.classList.toggle('on', x === b)); });
  const conv = () => { const tmp = { amount: g('e_amt').value, currency: g('e_cur').value, feeOn: isOn(g('e_fee')), feePct: g('e_feepct').value }; const v = expTWD(t, tmp); g('e_conv').textContent = v && tmp.currency !== 'TWD' ? `約 ${fmtMoney(v)}（匯率 ${rate(t, tmp.currency)}，可在行程設定修改）` : (tmp.feeOn && v ? `含手續費 ${fmtMoney(v)}` : ''); };
  bindToggle(g('e_fee'), on => { g('e_feebox').hidden = !on; conv(); });
  ['e_amt', 'e_cur', 'e_feepct'].forEach(id => g(id).addEventListener('input', conv)); conv();
  const d = g('e_del'); if (d) d.onclick = async () => { if (await ask(`刪除「${e.title || '這筆支出'}」？`, '刪除', true)) { t.expenses = t.expenses.filter(x => x !== e); save(); close && close(); render(); } };
  g('e_ok').onclick = () => {
    const amount = parseFloat(g('e_amt').value); if (!(amount > 0)) { toast('請輸入金額'); g('e_amt').focus(); return; }
    const split = picked(g('e_split')); if (!split.length) { toast('請至少選一位分攤成員'); return; }
    const o = { date: g('e_date').value, time: g('e_time').value, pay, amount, currency: g('e_cur').value, feeOn: isOn(g('e_fee')), feePct: parseFloat(g('e_feepct').value) || 0, cat, title: g('e_title').value.trim() || EXP_CATS.find(c => c[0] === cat)[1], payer: g('e_payer').value, split, note: g('e_note').value.trim() };
    if (e) Object.assign(e, o); else t.expenses.push({ id: uid(), ...o });
    save(); close && close(); if (!e) { S.moneySub = 'list'; save(); } render(); toast(e ? '已儲存' : `已記一筆 ${fmtAmt(amount, o.currency)}`);
  };
}

    const s = document.createElement('script');

    s.onerror = () => { mapsLoading = null; rej(new Error('BLOCKED')); };
    setTimeout(() => { if (!window.google?.maps?.importLibrary) { mapsLoading = null; rej(new Error('BLOCKED')); } }, 12000);
    document.head.appendChild(s);
  });
  return mapsLoading;
}

function decodeEntities(s){ const t = document.createElement('textarea'); t.innerHTML = s; return t.value; }
function cleanCaption(raw){

}
function guessQuery(text){

  const strip = l => l.replace(/^[^\p{L}\p{N}]+/u, '').replace(/^(店名|店家|地點|名稱|餐廳|地址|位置)\s*[:：]\s*/, '').replace(/#\S+/g, '').replace(/[\p{Extended_Pictographic}️]/gu, '').trim();
  const pick = re => { const l = lines.find(x => re.test(x)); return l ? strip(l) : ''; };
  const name = pick(/^\s*(📍|📌)|店名|店家|餐廳\s*[:：]/), addr = pick(/^\s*(🏠|🏡)|地址\s*[:：]/);
  if (name) return name.slice(0, 60); if (addr) return addr.slice(0, 60);
  return strip(lines.find(l => strip(l).length > 1) || '').slice(0, 40);
}

function decodeShareHash(h){ let b = h.replace(/-p/g, '+').replace(/-s/g, '/').replace(/[^A-Za-z0-9+/]/g, ''); while (b.length % 4) b += '='; return new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0))); }
let lastHash = '', pendingShare = null;
function checkHash(){
  const h = (location.hash || '').slice(1);
  if (!h.startsWith('s-') || h === lastHash) return; lastHash = h;
  try { if (sessionStorage.getItem('tripapp.lastShare') === h) return; sessionStorage.setItem('tripapp.lastShare', h); } catch (e) {}
  let txt; try { txt = decodeShareHash(h.slice(2)); } catch (e) { toast('分享內容讀不到，請在 IG 匯入長按貼上'); return; }
  const m = txt.match(/https?:\/\/[^\s"'<>]+/); const url = m ? m[0] : ''; const text = txt.replace(url, '').trim();

  if (S.view !== 'trip') { S.view = 'trip'; S.tab = 'plan'; save(); render(); }
  if (sampleFn) importSheet(null, true); else pendingShare = true;
  if (!sampleFn) setTimeout(() => { if (pendingShare && !sampleFn) { pendingShare = null; importSheet(null, !!S.apiKey); } }, 2500);

function tripText(t, onlyDay){
  const lines = []; const days = onlyDay ? [onlyDay] : t.days;
  if (!onlyDay) lines.push(`✈️ ${t.name}`, `${fmtFull(t.start)} – ${fmtFull(dayISO(t, t.days.length - 1))}（${t.days.length} 天）`, '');
  for (const d of days) {
    const i = dayIndex(t, d.id);
    lines.push(`📅 ${fmtFull(dayISO(t, i))} Day ${i + 1}${d.theme ? '｜' + (d.emoji || '') + d.theme : ''}`);
    const list = dayItems(t, d.id);
    if (!list.length) lines.push('（今日尚無排定行程）');
    for (const it of list) {
      lines.push(`${it.time ? '🕘 ' + it.time + ' ' : '・'}${KIND[it.kind]?.label || ''}｜${it.title}`);
      if (it.kind === 'flight') { const l = it.legs || []; if (l.length) lines.push(`   ${l.map(x => `${x.flightNo || ''} ${apCode(x.from) || x.from}→${apCode(x.to) || x.to}`).join('，')}`); }
      else if (it.location) lines.push(`   📍 ${it.location}`);
      if (it.cost?.amount) lines.push(`   💰 ${it.cost.label || '費用'} ${fmtAmt(it.cost.amount, it.cost.currency)}${it.cost.perPerson ? '/人' : ''}`);
    }
    lines.push('');
  }
  return lines.join('\n').trim();
}
